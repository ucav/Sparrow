name: Security Audit

on:
  schedule: [{cron: '0 8 * * 1'}]  # Every Monday
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock']

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
