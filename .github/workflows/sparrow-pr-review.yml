# Sample workflow that wires Sparrow into PR reviews.
# Triggered when a PR is opened or updated, or when a maintainer comments
# `@sparrow review` on a PR.

name: Sparrow PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '@sparrow review'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: ucav/Sparrow@master
        with:
          mode: review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event.pull_request.draft || false }}
          allowed-tools: "fs_read,search,symbols"
