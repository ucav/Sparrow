name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC every day
  workflow_dispatch: {}

jobs:
  build-test:
    name: Build + test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: no production Rust stubs
        shell: pwsh
        run: |
          $files = Get-ChildItem src -Recurse -Filter *.rs
          $matches = Select-String -Path $files.FullName -Pattern 'todo!\(|unimplemented!\('
          if ($matches) {
            $matches | ForEach-Object { Write-Error "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            exit 1
          }
      - name: cargo clippy
        run: cargo clippy --no-deps -- -D warnings
      - name: cargo test
        run: cargo test --all-targets

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit || true
      - name: Run cargo-audit
        run: cargo audit --deny warnings || true   # advisory, never blocks nightly
