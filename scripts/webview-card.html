<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg0:#0e0b08;--bg1:#171109;--stroke:#2c251c;--amber:#f2a93c;--cream:#ece2cf;--dim:#897d6c;--mono:'JetBrains Mono',ui-monospace,monospace;--sans:'Inter',system-ui,sans-serif}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:675px;background:radial-gradient(120% 120% at 50% 12%,var(--bg1),var(--bg0) 62%,#060403);font-family:var(--sans);color:var(--cream);overflow:hidden}
.wrap{position:relative;width:1200px;height:675px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.head{position:absolute;top:30px;left:46px;font-size:25px;font-weight:800;letter-spacing:-1px;z-index:2}
.head .a{color:var(--amber)}
.head .t{font-family:var(--mono);font-size:14px;color:var(--dim);font-weight:400;letter-spacing:1px;margin-left:12px}
.tag{position:absolute;top:36px;right:46px;font-family:var(--mono);font-size:14px;color:var(--dim);border:1px solid var(--stroke);border-radius:999px;padding:6px 14px;z-index:2}
.browser{width:1010px;border-radius:12px;overflow:hidden;border:1px solid var(--stroke);background:#1d1710;box-shadow:0 30px 90px rgba(0,0,0,.6);margin-top:84px}
.bbar{height:42px;display:flex;align-items:center;gap:8px;padding:0 16px;background:#241c12;border-bottom:1px solid var(--stroke)}
.dot{width:11px;height:11px;border-radius:50%}
.url{margin-left:14px;font-family:var(--mono);font-size:15px;color:var(--dim);background:#191309;border:1px solid var(--stroke);border-radius:7px;padding:5px 14px;flex:1;max-width:420px}
.clip{height:456px;overflow:hidden}
img{display:block;width:1010px;height:auto}
.cap{position:absolute;bottom:26px;left:46px;font-family:var(--mono);font-size:16px;color:var(--dim);z-index:2}
.cap b{color:var(--amber)}
</style></head><body><div class="wrap">
<div class="head">Sp<span class="a">a</span>rrow<span class="t">webview cockpit</span></div>
<div class="tag">TUI · WebView · JSON · gateway</div>
<div class="browser"><div class="bbar"><span class="dot" style="background:#f0674a"></span><span class="dot" style="background:#f2c94c"></span><span class="dot" style="background:#86c98b"></span><span class="url">localhost:7878 · sparrow cockpit</span></div>
<div class="clip"><img src="../assets/launch/video/webview-mockup.png"></div></div>
<div class="cap">one event stream — <b>swarm lanes, live diffs, git checkpoints, autonomy dial</b></div>
</div></body></html>
