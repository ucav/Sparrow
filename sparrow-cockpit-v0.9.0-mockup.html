<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sparrow v0.9.0 - Focus/Cockpit mockup</title>
  <style>
    :root{color-scheme:dark;--bg:#0f0c09;--panel:#17120d;--line:#342a20;--fg:#f0e4d2;--dim:#a79a88;--brand:#f2a93c;--ok:#74c258;--bad:#d96a63;--info:#6fa6e6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}
    .app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto}
    header{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);background:#17120d}
    header b{color:var(--brand);letter-spacing:6px;white-space:nowrap}.spacer{flex:1}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:#120e0a}.seg button{border:0;border-radius:6px;background:transparent;color:var(--dim);padding:6px 12px}.seg .on{background:rgba(242,169,60,.16);color:var(--brand)}
    main{display:grid;place-items:start center;padding:34px 18px;overflow:auto}
    .stream{width:min(860px,100%);font-size:17px;line-height:1.7}.line{padding:8px 0}.you{color:var(--brand)}.sparrow{color:var(--ok)}
    .actions{display:flex;justify-content:center;gap:10px;padding:12px 18px;border-top:1px solid var(--line);background:#14100c}
    .actions button,.composer button{border:1px solid var(--line);border-radius:8px;background:#18130e;color:var(--fg);padding:9px 16px;font:inherit}
    .actions .ok{color:var(--ok);border-color:rgba(116,194,88,.45)}.actions .undo{color:var(--bad);border-color:rgba(217,106,99,.45)}.actions .explain{color:var(--info);border-color:rgba(111,166,230,.45)}
    .composer{display:grid;grid-template-columns:auto auto minmax(0,860px) auto;gap:8px;padding:14px 18px 20px;justify-content:center;border-top:1px solid var(--line);background:#100d09}
    textarea{min-height:48px;resize:none;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);padding:12px 14px;font:15px/1.45 inherit}
    .note{color:var(--dim);font-size:12px}
    @media(max-width:680px){header{flex-wrap:wrap}.spacer{display:none}.seg{margin-left:auto}header b{letter-spacing:2px}.composer{grid-template-columns:auto auto 1fr auto}.actions button{flex:1;padding-inline:8px}}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <b>SPARROW</b>
      <span class="note">v0.9.0 mockup</span>
      <span class="spacer"></span>
      <span class="seg" aria-label="View mode"><button class="on">Focus</button><button>Cockpit</button></span>
    </header>
    <main>
      <section class="stream" aria-label="Conversation">
        <div class="line"><span class="you">you ›</span> fix this failing test</div>
        <div class="line"><span class="sparrow">sparrow ›</span> I’ll inspect it, ask before changing anything, then verify.</div>
        <div class="line">Sparrow is ready. What should we fix today?</div>
      </section>
    </main>
    <nav class="actions" aria-label="Focus quick actions">
      <button class="ok">OK</button>
      <button class="undo">Undo</button>
      <button class="explain">Explain</button>
    </nav>
    <form class="composer">
      <button type="button" aria-label="Attach a file">+</button>
      <button type="button" aria-label="Dictate with microphone">●</button>
      <textarea aria-label="Ask Sparrow" placeholder="Type what you want to fix..."></textarea>
      <button type="submit">run</button>
    </form>
  </div>
</body>
</html>
