[package]
name = "sparrow-providers"
version = "0.9.2"
edition = "2024"
description = "Model provider adapters (Brain trait, OpenAI-compat, Anthropic, Ollama, Responses) for Sparrow"
license = "MIT"

[dependencies]
sparrow-core = { version = "0.9.2", path = "../sparrow-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking", "multipart"] }
futures = "0.3"
anyhow = "1"
tracing = "0.1"
regex = "1"
url = "2"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
