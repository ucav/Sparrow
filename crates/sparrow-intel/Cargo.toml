[package]
name = "sparrow-intel"
version = "0.10.3"
edition = "2024"
description = "Public release intelligence cache for Sparrow"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"
