[package]
name = "sparrow-memory"
version = "0.10.0"
edition = "2024"
description = "Persistent memory (SQLite facts, FTS5 search, knowledge graph, symbol index) and secret redaction for Sparrow"
license = "MIT"

[dependencies]
sparrow-core = { version = "0.10.0", path = "../sparrow-core" }
sparrow-providers = { version = "0.10.0", path = "../sparrow-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
regex = "1"
tree-sitter = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }

[features]
treesitter = ["tree-sitter", "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript"]
