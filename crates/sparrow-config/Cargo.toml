[package]
name = "sparrow-config"
version = "0.10.3"
edition = "2024"
description = "Configuration, provider registry, auth/credential store, permissions, hooks, sandbox and humanize layer for Sparrow"
license = "MIT"

[dependencies]
sparrow-core = { version = "0.10.3", path = "../sparrow-core" }
sparrow-providers = { version = "0.10.3", path = "../sparrow-providers" }
sparrow-intel = { version = "0.10.3", path = "../sparrow-intel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
async-trait = "0.1"
dirs = "6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking", "multipart"] }
secrecy = { version = "0.10", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rand = "0.8"
chacha20poly1305 = "0.10"
keyring = { version = "3", optional = true }

[features]
keyring-dep = ["keyring"]

[dev-dependencies]
tempfile = "3"
