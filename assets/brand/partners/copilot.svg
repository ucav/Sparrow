<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- GitHub Copilot icon -->
  <rect width="100" height="100" rx="22" fill="none"/>
  <!-- Face outline -->
  <ellipse cx="50" cy="46" rx="30" ry="32" fill="currentColor" opacity="0.15"/>
  <ellipse cx="50" cy="46" rx="30" ry="32" stroke="currentColor" stroke-width="5" fill="none"/>
  <!-- Eyes -->
  <circle cx="38" cy="40" r="6" fill="currentColor"/>
  <circle cx="62" cy="40" r="6" fill="currentColor"/>
  <!-- Mouth / smile -->
  <path d="M35 58 Q50 70 65 58" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Visor -->
  <path d="M20 46 Q20 14 50 14 Q80 14 80 46" stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Ear pieces -->
  <path d="M20 40 L12 48 L20 56" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M80 40 L88 48 L80 56" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
