<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0b08"/>
      <stop offset="100%" stop-color="#16120d"/>
    </linearGradient>
    <style>
      .mono  { font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; font-size: 19px; }
      .sans  { font-family: 'Inter',system-ui,-apple-system,sans-serif; }
      .amber { fill: #f2a93c; }
      .cream { fill: #ece2cf; }
      .dim   { fill: #897d6c; }
      .green { fill: #74c258; }
      .red   { fill: #d96a63; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="80" y="84" class="sans amber" font-size="20" font-weight="700" letter-spacing="3">SPARROW</text>
  <text x="80" y="116" class="sans cream" font-size="34" font-weight="700">what one run looks like</text>

  <!-- terminal window -->
  <g transform="translate(80,160)">
    <rect x="0" y="0" width="1040" height="430" rx="12" fill="#0a0805" stroke="#2c251c"/>
    <circle cx="24" cy="24" r="7" fill="#f0674a"/>
    <circle cx="46" cy="24" r="7" fill="#f2c94c"/>
    <circle cx="68" cy="24" r="7" fill="#74c258"/>
    <text x="520" y="28" class="mono dim" font-size="13" text-anchor="middle">~/api-service — sparrow</text>

    <g transform="translate(30,76)">
      <text class="mono dim" y="0">$ sparrow run "add a rate limiter to the auth endpoint" \</text>
      <text class="mono dim" y="26">      --max-cost-usd 0.10 --max-wall-secs 60</text>
      <text class="mono amber" y="68">→ planner    gpt-4o-mini        1,247 tok   $0.0004   2.1s</text>
      <text class="mono amber" y="94">→ coder      claude-haiku-4.5   3,402 tok   $0.0019   6.4s</text>
      <text class="mono green" y="120">    ✓ checkpoint cb_8a2e   src/auth.rs (+24 -1), middleware/mod.rs (+18)</text>
      <text class="mono amber" y="146">→ exec       cargo test                              12.8s</text>
      <text class="mono green" y="172">    ✓ 14 passed   0 failed   0 ignored</text>
      <text class="mono amber" y="198">→ verifier   qwen2.5-coder-32b    891 tok   $0.0003   3.0s</text>
      <text class="mono green" y="224">    ✓ approved — rate limit covered, no auth bypass</text>
      <text class="mono green" y="262">✓ done   24.6s wall   $0.0026 spent   5,540 tok   3 files changed</text>
      <text class="mono dim"   y="304">$ sparrow rewind --last</text>
      <text class="mono cream" y="330">🐦  Restored to before cb_8a2e. Working tree clean.</text>
    </g>
  </g>

  <text x="80"  y="640" class="mono amber" font-size="18" font-weight="600">cargo install sparrow-cli</text>
  <text x="1120" y="640" class="mono dim" font-size="14" text-anchor="end">github.com/ucav/Sparrow</text>
</svg>
