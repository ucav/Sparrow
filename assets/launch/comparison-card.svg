<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0b08"/>
      <stop offset="100%" stop-color="#16120d"/>
    </linearGradient>
    <style>
      .mono  { font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace; }
      .sans  { font-family: 'Inter',system-ui,-apple-system,sans-serif; }
      .amber { fill: #f2a93c; }
      .cream { fill: #ece2cf; }
      .dim   { fill: #897d6c; }
      .row   { stroke: #2c251c; stroke-width: 1; }
      .ok    { fill: #74c258; }
      .no    { fill: #d96a63; }
      .mid   { fill: #f2c94c; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <text x="80" y="90"  class="sans cream" font-size="42" font-weight="800" letter-spacing="-1">why Sparrow</text>
  <text x="80" y="124" class="sans dim"   font-size="18">vs the agents you already pay for</text>

  <g transform="translate(80,170)">
    <!-- header row -->
    <g class="sans" font-size="16" font-weight="600">
      <rect x="0" y="0" width="1040" height="44" fill="#1d1710"/>
      <text x="20"  y="29" class="cream">capability</text>
      <text x="580" y="29" class="dim" text-anchor="middle">Claude Code</text>
      <text x="720" y="29" class="dim" text-anchor="middle">Codex CLI</text>
      <text x="850" y="29" class="dim" text-anchor="middle">Aider</text>
      <text x="980" y="29" class="amber" text-anchor="middle" font-weight="700">Sparrow</text>
    </g>

    <!-- rows -->
    <g font-family="Inter" font-size="15">
      <!-- row 1 -->
      <line class="row" x1="0" y1="44" x2="1040" y2="44"/>
      <text x="20" y="78" class="cream">single static binary</text>
      <text x="580" y="78" class="no" text-anchor="middle">✗</text>
      <text x="720" y="78" class="no" text-anchor="middle">✗</text>
      <text x="850" y="78" class="no" text-anchor="middle">✗</text>
      <text x="980" y="78" class="ok" text-anchor="middle">✓</text>
      <!-- row 2 -->
      <line class="row" x1="0" y1="96" x2="1040" y2="96"/>
      <text x="20" y="130" class="cream">any provider, any model</text>
      <text x="580" y="130" class="no" text-anchor="middle">Anthropic only</text>
      <text x="720" y="130" class="no" text-anchor="middle">OpenAI only</text>
      <text x="850" y="130" class="ok" text-anchor="middle">✓</text>
      <text x="980" y="130" class="ok" text-anchor="middle">38 providers</text>
      <!-- row 3 -->
      <line class="row" x1="0" y1="148" x2="1040" y2="148"/>
      <text x="20" y="182" class="cream">local-first (Ollama OOTB)</text>
      <text x="580" y="182" class="no" text-anchor="middle">✗</text>
      <text x="720" y="182" class="no" text-anchor="middle">✗</text>
      <text x="850" y="182" class="mid" text-anchor="middle">~</text>
      <text x="980" y="182" class="ok" text-anchor="middle">✓</text>
      <!-- row 4 -->
      <line class="row" x1="0" y1="200" x2="1040" y2="200"/>
      <text x="20" y="234" class="cream">git checkpoints + rewind</text>
      <text x="580" y="234" class="no" text-anchor="middle">✗</text>
      <text x="720" y="234" class="no" text-anchor="middle">✗</text>
      <text x="850" y="234" class="mid" text-anchor="middle">~</text>
      <text x="980" y="234" class="ok" text-anchor="middle">✓</text>
      <!-- row 5 -->
      <line class="row" x1="0" y1="252" x2="1040" y2="252"/>
      <text x="20" y="286" class="cream">hard budget caps in runtime</text>
      <text x="580" y="286" class="no" text-anchor="middle">✗</text>
      <text x="720" y="286" class="no" text-anchor="middle">✗</text>
      <text x="850" y="286" class="no" text-anchor="middle">✗</text>
      <text x="980" y="286" class="ok" text-anchor="middle">✓</text>
      <!-- row 6 -->
      <line class="row" x1="0" y1="304" x2="1040" y2="304"/>
      <text x="20" y="338" class="cream">webview cockpit + TUI + JSON</text>
      <text x="580" y="338" class="mid" text-anchor="middle">TUI</text>
      <text x="720" y="338" class="mid" text-anchor="middle">TUI</text>
      <text x="850" y="338" class="mid" text-anchor="middle">TUI</text>
      <text x="980" y="338" class="ok" text-anchor="middle">all three</text>
      <!-- row 7 -->
      <line class="row" x1="0" y1="356" x2="1040" y2="356"/>
      <text x="20" y="390" class="cream">drop-in reader for ~/.claude/</text>
      <text x="580" y="390" class="dim" text-anchor="middle">n/a</text>
      <text x="720" y="390" class="no" text-anchor="middle">✗</text>
      <text x="850" y="390" class="no" text-anchor="middle">✗</text>
      <text x="980" y="390" class="ok" text-anchor="middle">✓</text>
      <!-- row 8 -->
      <line class="row" x1="0" y1="408" x2="1040" y2="408"/>
      <text x="20" y="442" class="cream">zero telemetry by default</text>
      <text x="580" y="442" class="mid" text-anchor="middle">~</text>
      <text x="720" y="442" class="mid" text-anchor="middle">~</text>
      <text x="850" y="442" class="ok" text-anchor="middle">✓</text>
      <text x="980" y="442" class="ok" text-anchor="middle">✓</text>
      <!-- row 9 -->
      <line class="row" x1="0" y1="460" x2="1040" y2="460"/>
      <text x="20" y="494" class="cream">source open, MIT</text>
      <text x="580" y="494" class="no" text-anchor="middle">✗ closed</text>
      <text x="720" y="494" class="no" text-anchor="middle">✗ closed</text>
      <text x="850" y="494" class="ok" text-anchor="middle">Apache-2</text>
      <text x="980" y="494" class="ok" text-anchor="middle">MIT</text>
      <line class="row" x1="0" y1="512" x2="1040" y2="512"/>
    </g>
  </g>

  <text x="80" y="650" class="mono dim" font-size="14">github.com/ucav/Sparrow  ·  cargo install sparrow-cli</text>
</svg>
