ShortDescription: A local-first Rust agent cockpit — route, run, replay, rewind.
Description: |-
  Sparrow is a single-binary CLI agent written in Rust. It routes each task to
  the cheapest capable model, keeps you in control with Git-backed checkpoints,
  and makes every run replayable. Local models (Ollama) are always the first hop;
  cloud providers are explicit fallbacks.
